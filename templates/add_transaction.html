<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAPP — Add Transaction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #f0f0f0; font-family: 'Arial Black', Arial, sans-serif; min-height: 100vh; }
        .navbar { background: #111; border-bottom: 3px solid #ff2d78; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 28px; font-weight: 900; color: #ff2d78; letter-spacing: 4px; }
        .nav-links { display: flex; gap: 24px; list-style: none; }
        .nav-links a { color: #f0f0f0; text-decoration: none; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
        .nav-links a:hover { color: #ff2d78; }
        .container { max-width: 500px; margin: 0 auto; padding: 32px; }
        .page-title { font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: #888; margin-bottom: 32px; }
        .form-section { background: #111; border-radius: 8px; padding: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #888; margin-bottom: 8px; }
        input, select { width: 100%; background: #0a0a0a; border: 1px solid #333; color: #f0f0f0; padding: 12px 16px; border-radius: 4px; font-family: 'Arial Black', Arial, sans-serif; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #00f5ff; }
        .btn { padding: 14px 32px; border: none; border-radius: 4px; font-family: 'Arial Black', Arial, sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-block; width: 100%; text-align: center; margin-top: 8px; }
        .btn-cyan { background: #00f5ff; color: #0a0a0a; }
        .btn-outline { background: transparent; border: 1px solid #333; color: #888; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">SLAPP</div>
    <ul class="nav-links">
        <li><a href="/">Dashboard</a></li>
        <li><a href="/orders">Orders</a></li>
        <li><a href="/bake">Bake Brief</a></li>
        <li><a href="/stock">Stock</a></li>
        <li><a href="/finance">Finance</a></li>
        <li><a href="/recipes">Recipes</a></li>
        <li><a href="/popups">Popups</a></li>
        <li><a href="/settings">Settings</a></li>
    </ul>
</nav>
<div class="container">
    <p class="page-title">Add Transaction</p>
    <form method="POST" action="/finance/cashflow/add">
        <div class="form-section">
            <div class="form-group">
                <label>Type</label>
                <select name="type" required>
                    <option value="expense">Expense (money out)</option>
                    <option value="income">Income (money in)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="ingredients">Ingredients</option>
                    <option value="packaging">Packaging</option>
                    <option value="marketing">Marketing</option>
                    <option value="transport">Transport</option>
                    <option value="equipment">Equipment</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" name="amount" step="0.01" min="0.01" placeholder="e.g. 500" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" name="description" placeholder="e.g. Bought stickers from Canva">
            </div>
            <button type="submit" class="btn btn-cyan">Add Transaction</button>
            <a href="/finance/cashflow" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
